<svg xmlns="http://www.w3.org/2000/svg" width="320" height="440" viewBox="0 0 320 440">
  <defs>
    <radialGradient id="bg" cx="0.5" cy="0.45" r="0.55">
      <stop offset="0" stop-color="#E9F8EF"/>
      <stop offset="1" stop-color="#CDEFD9"/>
    </radialGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C9B6EC"/>
      <stop offset="1" stop-color="#E9B8D8"/>
    </linearGradient>
    <linearGradient id="iris" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3E8A68"/>
      <stop offset="0.6" stop-color="#5FB98C"/>
      <stop offset="1" stop-color="#A8E6C4"/>
    </linearGradient>
    <linearGradient id="dress" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#BDE8CF"/>
      <stop offset="1" stop-color="#9ED9B6"/>
    </linearGradient>
    <g id="eye">
      <ellipse cx="0" cy="0" rx="16" ry="19" fill="#fff"/>
      <ellipse cx="0" cy="2" rx="12.5" ry="16.5" fill="url(#iris)"/>
      <ellipse cx="0" cy="3" rx="6" ry="8.5" fill="#1F3D33"/>
      <circle cx="-5" cy="-6" r="4.6" fill="#fff"/>
      <circle cx="4.5" cy="8" r="2.2" fill="#fff"/>
      <path d="M-21 -15 L-16 -10 Q0 -29 16 -10" fill="none" stroke="#4A3550" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <path id="spark" d="M0 -9 Q0 0 9 0 Q0 0 0 9 Q0 0 -9 0 Q0 0 0 -9Z"/>
  </defs>

  <!-- soft background -->
  <circle cx="160" cy="215" r="148" fill="url(#bg)"/>
  <ellipse cx="160" cy="404" rx="62" ry="8" fill="#BFE6CF" opacity="0.9"/>

  <!-- sparkles -->
  <g fill="#F6B8D1"><use href="#spark" x="44" y="110"/><animate attributeName="opacity" values="0;1;0" dur="2.4s" repeatCount="indefinite"/></g>
  <g fill="#C9B6EC"><use href="#spark" x="282" y="250" transform="scale(1)"/><animate attributeName="opacity" values="0;1;0" dur="2.8s" begin="0.8s" repeatCount="indefinite"/></g>
  <g fill="#9ED9B6"><use href="#spark" x="58" y="300"/><animate attributeName="opacity" values="0;1;0" dur="3s" begin="1.4s" repeatCount="indefinite"/></g>
  <g fill="#F6B8D1"><use href="#spark" x="270" y="64"/><animate attributeName="opacity" values="0;1;0" dur="2.6s" begin="0.4s" repeatCount="indefinite"/></g>

  <!-- whole character gently bobbing -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur="2.4s" repeatCount="indefinite"/>

    <!-- back hair -->
    <path d="M70 150 Q66 60 160 56 Q254 60 250 150 L258 300 Q244 318 222 306 L214 230 L106 230 L98 306 Q76 318 62 300 Z"
          fill="url(#hair)" stroke="#6B4F7B" stroke-width="3" stroke-linejoin="round"/>

    <!-- legs & shoes -->
    <rect x="140" y="330" width="15" height="58" rx="6" fill="#FFE3D3" stroke="#6B4F7B" stroke-width="3"/>
    <rect x="165" y="330" width="15" height="58" rx="6" fill="#FFE3D3" stroke="#6B4F7B" stroke-width="3"/>
    <rect x="139.5" y="360" width="16" height="28" rx="5" fill="#fff" stroke="#6B4F7B" stroke-width="3"/>
    <rect x="164.5" y="360" width="16" height="28" rx="5" fill="#fff" stroke="#6B4F7B" stroke-width="3"/>
    <ellipse cx="146" cy="394" rx="14" ry="8" fill="#C9B6EC" stroke="#6B4F7B" stroke-width="3"/>
    <ellipse cx="175" cy="394" rx="14" ry="8" fill="#C9B6EC" stroke="#6B4F7B" stroke-width="3"/>

    <!-- left arm (down) -->
    <path d="M128 226 Q108 262 108 296" fill="none" stroke="#6B4F7B" stroke-width="19" stroke-linecap="round"/>
    <path d="M128 226 Q108 262 108 296" fill="none" stroke="#BDE8CF" stroke-width="13" stroke-linecap="round"/>
    <circle cx="108" cy="302" r="9" fill="#FFE3D3" stroke="#6B4F7B" stroke-width="3"/>

    <!-- dress -->
    <path d="M128 214 L192 214 L222 336 Q160 350 98 336 Z" fill="url(#dress)" stroke="#6B4F7B" stroke-width="3" stroke-linejoin="round"/>
    <path d="M104 322 Q160 336 216 322" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity="0.9"/>
    <!-- sailor collar + ribbon -->
    <path d="M128 214 L160 246 L192 214 L200 230 Q160 262 120 230 Z" fill="#fff" stroke="#6B4F7B" stroke-width="3" stroke-linejoin="round"/>
    <path d="M160 244 L144 236 L146 254 Z M160 244 L176 236 L174 254 Z" fill="#F6B8D1" stroke="#6B4F7B" stroke-width="2.5" stroke-linejoin="round"/>
    <circle cx="160" cy="245" r="4.5" fill="#F39DBF" stroke="#6B4F7B" stroke-width="2.5"/>

    <!-- neck & face -->
    <rect x="150" y="200" width="20" height="18" fill="#FFE3D3" stroke="#6B4F7B" stroke-width="3"/>
    <path d="M90 140 Q88 214 160 216 Q232 214 230 140 Q228 84 160 82 Q92 84 90 140Z" fill="#FFE3D3" stroke="#6B4F7B" stroke-width="3"/>

    <!-- blush -->
    <ellipse cx="114" cy="182" rx="12" ry="6.5" fill="#F6A9C6" opacity="0.6"/>
    <ellipse cx="206" cy="182" rx="12" ry="6.5" fill="#F6A9C6" opacity="0.6"/>
    <path d="M108 180 l4 4 M114 180 l4 4 M200 180 l4 4 M206 180 l4 4" stroke="#E98AA6" stroke-width="1.6" stroke-linecap="round"/>

    <!-- eyes (blinking) -->
    <g transform="translate(130 160)">
      <g><animateTransform attributeName="transform" type="scale" values="1 1;1 1;1 0.08;1 1" keyTimes="0;0.92;0.96;1" dur="4s" repeatCount="indefinite"/><use href="#eye"/></g>
    </g>
    <g transform="translate(190 160)">
      <g><animateTransform attributeName="transform" type="scale" values="1 1;1 1;1 0.08;1 1" keyTimes="0;0.92;0.96;1" dur="4s" repeatCount="indefinite"/><use href="#eye" transform="scale(-1 1)"/></g>
    </g>

    <!-- nose & mouth -->
    <circle cx="160" cy="181" r="1.6" fill="#D99A8A"/>
    <path d="M151 190 Q160 201 169 190 Q160 194 151 190Z" fill="#E98AA6" stroke="#6B4F7B" stroke-width="2.2" stroke-linejoin="round"/>

    <!-- bangs -->
    <path d="M86 150 Q84 76 160 70 Q236 76 234 150 L224 122 L212 132 L198 108 L184 128 L166 100 L150 126 L134 104 L118 130 L106 116 L96 140 Z"
          fill="url(#hair)" stroke="#6B4F7B" stroke-width="3" stroke-linejoin="round"/>
    <!-- front side locks -->
    <path d="M90 128 Q78 190 92 250 Q100 236 102 214 Q98 170 106 132 Z" fill="url(#hair)" stroke="#6B4F7B" stroke-width="3" stroke-linejoin="round"/>
    <path d="M230 128 Q242 190 228 250 Q220 236 218 214 Q222 170 214 132 Z" fill="url(#hair)" stroke="#6B4F7B" stroke-width="3" stroke-linejoin="round"/>
    <!-- right arm waving -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-10 192 222;14 192 222;-10 192 222" dur="1.1s" repeatCount="indefinite"/>
      <path d="M192 224 Q232 206 250 160" fill="none" stroke="#6B4F7B" stroke-width="19" stroke-linecap="round"/>
      <path d="M192 224 Q232 206 250 160" fill="none" stroke="#BDE8CF" stroke-width="13" stroke-linecap="round"/>
      <circle cx="252" cy="151" r="10" fill="#FFE3D3" stroke="#6B4F7B" stroke-width="3"/>
    </g>

    <!-- hair shine -->
    <path d="M118 92 Q136 84 152 86" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity="0.7"/>

    <!-- ahoge -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-8 162 72;10 162 72;-8 162 72" dur="1.6s" repeatCount="indefinite"/>
      <path d="M158 72 Q146 40 176 32 Q160 48 168 72 Z" fill="url(#hair)" stroke="#6B4F7B" stroke-width="3" stroke-linejoin="round"/>
    </g>

    <!-- sakura clip -->
    <g transform="translate(212 98)">
      <g fill="#F6B8D1" stroke="#6B4F7B" stroke-width="2">
        <ellipse cx="0" cy="-8" rx="5.5" ry="8"/>
        <ellipse cx="0" cy="-8" rx="5.5" ry="8" transform="rotate(72)"/>
        <ellipse cx="0" cy="-8" rx="5.5" ry="8" transform="rotate(144)"/>
        <ellipse cx="0" cy="-8" rx="5.5" ry="8" transform="rotate(216)"/>
        <ellipse cx="0" cy="-8" rx="5.5" ry="8" transform="rotate(288)"/>
      </g>
      <circle r="4" fill="#FFE9A8" stroke="#6B4F7B" stroke-width="2"/>
    </g>
  </g>
</svg>
